<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Qurishi Wallpapers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  text-align: center;
  padding: 20px;
  background: #000;
  color: #ffcc00;
  font-size: 26px;
  font-weight: bold;
}

#search {
  width: 90%;
  display: block;
  margin: 10px auto;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 12px;
}

.item {
  background: #1c1c1c;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}

.item img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  cursor: pointer;
}

.item:hover {
  transform: scale(1.04);
}

.whatsapp {
  display: block;
  text-align: center;
  background: #25D366;
  color: white;
  padding: 10px;
  text-decoration: none;
  font-weight: bold;
}

/* FULLSCREEN */
.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.fullscreen img {
  max-width: 90%;
  max-height: 80%;
  border-radius: 10px;
}

.close {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 30px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>🎨 Qurishi Premium Wallpapers</header>

<input type="text" id="search" placeholder="Search wallpaper ID...">

<div class="gallery" id="gallery"></div>

<div class="fullscreen" id="fullscreen">
  <div class="close" onclick="closeFull()">✖</div>
  <img id="fullImg">
</div>

<script>
const whatsappNumber = "93782008590";

let data = [];
const gallery = document.getElementById("gallery");

/* 🔥 IMPORTANT FIX: ./ added */
fetch("./data.json")
.then(res => res.json())
.then(json => {
  data = json;
  render(data);
})
.catch(err => {
  console.log("JSON ERROR:", err);
});

/* 🖼️ RENDER */
function render(items){
  gallery.innerHTML = "";

  items.forEach(item => {
    let div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <img src="${item.image}" onclick="openFull('${item.image}')">
      <a class="whatsapp" target="_blank"
        href="https://wa.me/${whatsappNumber}?text=سلام، زه د Wallpaper ${item.id} په اړه معلومات غواړم">
        📲 Order on WhatsApp
      </a>
    `;

    gallery.appendChild(div);
  });
}

/* 🔍 SEARCH */
document.getElementById("search").addEventListener("input", function(){
  let val = this.value.toLowerCase();
  let filtered = data.filter(d => d.id.toLowerCase().includes(val));
  render(filtered);
});

/* 🖥️ FULLSCREEN */
function openFull(img){
  document.getElementById("fullscreen").style.display = "flex";
  document.getElementById("fullImg").src = img;
}

function closeFull(){
  document.getElementById("fullscreen").style.display = "none";
}
</script>

</body>
</html>
