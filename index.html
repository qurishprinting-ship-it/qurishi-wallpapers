<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Qurishi 3D Wallpapers</title>
  <meta name="description" content="Qurishi Premium Wallpapers — Browse and order luxury wall, ceiling and flat wallpaper designs. Fast delivery across Afghanistan.">
  <meta name="keywords" content="wallpaper, wall design, ceiling design, flat design, qurishi, 3D wallpaper, Afghanistan wallpaper">
  <meta name="robots" content="index, follow">

  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Qurishi Premium Wallpapers">
  <meta property="og:description" content="Browse luxury wall, ceiling and flat wallpaper designs. Order directly on WhatsApp.">
  <meta property="og:image"       content="assets/favicon.png">
  <meta property="og:url"         content="https://qurishiprinting.com">
  <meta property="og:site_name"   content="Qurishi Wallpapers">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon"     href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Qurishi Premium Wallpapers",
    "description": "3D wall, ceiling and flat wallpaper designs available for order via WhatsApp.",
    "url": "https://qurishiprinting.com",
    "telephone": "+93782008590",
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+93782008590",
      "contactType": "customer service",
      "availableLanguage": ["Pashto", "Dari", "English"]
    }
  }
  </script>
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header id="site-header">
    <a href="#" class="logo" aria-label="Qurishi Wallpapers Home">
      <img src="assets/logo.png" alt="Qurishi Logo" onerror="this.style.display='none'">
      <span class="logo-text">
        Qurishi
        <small class="logo-sub">3D Wallpapers</small>
      </span>
    </a>

    <div class="header-controls">

      <!-- Dark / Light Mode Toggle -->
      <button id="themeToggle" aria-label="Toggle dark/light mode" class="theme-btn">
        <!-- Sun icon — shown in dark mode -->
        <svg class="sun-icon" width="19" height="19" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22"  y1="19.22" x2="5.64"  y2="17.76"/>
          <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
        </svg>
        <!-- Moon icon — shown in light mode -->
        <svg class="moon-icon" width="19" height="19" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Language Selector -->
      <div class="lang-wrap">
        <select id="languageSelect" aria-label="Select Language">
          <option value="en">🌐 English</option>
          <option value="ps">🌐 پښتو</option>
          <option value="fa">🌐 دری</option>
        </select>
      </div>

    </div>
  </header>

  <!-- ===================== HERO ===================== -->
  <section id="hero">
    <h1 class="hero-headline">🎨 Qurishi Premium Wallpapers</h1>
    <p class="hero-sub">Wall · Ceiling · Flat — Order Direct on WhatsApp</p>

    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="searchInput" placeholder="Search by ID or title…"
             autocomplete="off" spellcheck="false">
    </div>
  </section>

  <!-- ===================== TABS ===================== -->
  <nav id="tabs-bar" role="tablist" aria-label="Wallpaper Categories">
    <button class="tab active" data-category="all"     role="tab" aria-selected="true">All</button>
    <button class="tab"        data-category="wall"    role="tab" aria-selected="false">Wall</button>
    <button class="tab"        data-category="ceiling" role="tab" aria-selected="false">Ceiling</button>
    <button class="tab"        data-category="flat"    role="tab" aria-selected="false">Flat</button>
  </nav>

  <!-- ===================== GALLERY ===================== -->
  <main id="gallery-section">
    <div id="gallery" role="list"></div>
    <p id="no-results" aria-live="polite"></p>
  </main>

  <!-- ===================== PAGINATION ===================== -->
  <nav id="pagination" aria-label="Gallery Pages">
    <button id="prevBtn" class="pg-btn" disabled>← Prev</button>
    <span   id="pageNumber">Page 1 / 1</span>
    <button id="nextBtn" class="pg-btn" disabled>Next →</button>
  </nav>

  <!-- ===================== PREVIEW MODAL ===================== -->
  <div id="previewModal" role="dialog" aria-modal="true" aria-label="Wallpaper Preview">
    <button id="closeModal" aria-label="Close preview">✕</button>

    <div class="modal-inner">
      <div class="modal-img-wrap">
        <img id="previewImage" src="" alt="Wallpaper Preview" draggable="false">
      </div>
      <div class="modal-meta">
        <div id="previewTitle"></div>
        <div id="previewId"></div>
      </div>
      <a id="whatsappBtn" href="#" target="_blank" rel="noopener">📲 Order on WhatsApp</a>
    </div>
  </div>

  <!-- ===================== SCROLL TOP ===================== -->
  <button id="scrollTop" aria-label="Scroll to top">↑</button>

  <!-- ===================== FOOTER ===================== -->
  <footer>
    <p>© 2026 <a href="https://qurishiprinting.com" target="_blank" rel="noopener">Qurishi Printing</a> · All rights reserved</p>
  </footer>

  <script src="translations.js"></script>
  <script src="script.js"></script>

</body>
</html>
