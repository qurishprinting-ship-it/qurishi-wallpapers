name: Auto Update Gallery

on:
  push:
    paths:
      - "images/**"
      - "index.html"
      - "script.js"
  workflow_dispatch: # دا اختیار تاسو ته اجازه درکوي چې په لاسي ډول یې هم رن کړئ

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate data.json
        run: |
          python3 << 'EOF'
          import os
          import json

          categories = [
              ("wall", "images/wall"),
              ("ceiling", "images/ceiling"),
              ("flat", "images/flat")
          ]

          data = []

          for category, folder in categories:
              if not os.path.exists(folder):
                  continue

              files = sorted(
                  os.listdir(folder),
                  reverse=True
              )

              for file in files:
                  if file.lower().endswith((".jpg", ".jpeg", ".png", ".webp")):
                      image_id = os.path.splitext(file)[0]
                      
                      # دلته موږ د عکس بشپړ او دقیق مسیر (Path) په مستقیم ډول ډیټابیس ته ورکوو
                      data.append({
                          "id": image_id,
                          "title": f"{category.capitalize()} {image_id}",
                          "category": category,
                          "image": f"{folder}/{file}"
                      })

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
          EOF

      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Automated data.json update [Skip CI]"
          git push origin main
