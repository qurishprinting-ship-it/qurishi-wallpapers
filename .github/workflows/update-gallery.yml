name: Auto Update Gallery

# Keeps data.json + thumbnails in sync when images are added/removed OUTSIDE the Admin panel
# (e.g. dragged into GitHub by hand). It MERGES: existing titles, IDs and metadata are never overwritten.
on:
  push:
    paths:
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/sync_data.py
      - name: Commit changes
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json thumbs
          git diff --cached --quiet && exit 0
          git commit -m "Auto update data.json and thumbnails"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
